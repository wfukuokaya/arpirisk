# Builds the static calculator with Shinylive and deploys it to Cloudflare
# Pages. Requires the repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID, and a Cloudflare Pages project named below. It runs
# when a release is published or when started by hand, so that a model under
# revision is never deployed by an ordinary push.
on:
  release:
    types: [published]
  workflow_dispatch:

name: deploy-app

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_PROJECT: arpi-treatment-effect-estimator
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::shinylive, any::shiny, any::bslib
      - name: Build the Shinylive site
        run: Rscript tools/build_shinylive.R _site
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ env.CLOUDFLARE_PROJECT }}
