on:
  push:
    branches: [main]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          # On Windows, the R process that Quarto starts does not see the
          # library where R CMD build installs the package, so the Quarto
          # vignette is built and checked on Linux and macOS only.
          - {os: windows-latest, r: 'release', build_args: '"--no-build-vignettes"', check_args: '"--ignore-vignettes"'}
          - {os: macos-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran", ${{ matrix.config.check_args || '"--as-cran"' }})'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf", ${{ matrix.config.build_args || '"--no-manual"' }})'
